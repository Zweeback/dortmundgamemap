name: Orchestrator private hardening

on:
  pull_request:
    paths:
      - 'orchestrator_private/**'
      - '.github/workflows/orchestrator-private-hardening.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble connector-safe staged sources
        run: |
          cat \
            orchestrator_private/src/orchestrator/main.py.part1 \
            orchestrator_private/src/orchestrator/main.py.part2 \
            orchestrator_private/src/orchestrator/main.py.part3 \
            orchestrator_private/src/orchestrator/main.py.part4 \
            > orchestrator_private/src/orchestrator/main.py
          cat \
            orchestrator_private/src/tests/test_lease_chaos.py.part1 \
            orchestrator_private/src/tests/test_lease_chaos.py.part2 \
            > orchestrator_private/src/tests/test_lease_chaos.py
          cat \
            orchestrator_private/src/tests/test_completion_verification.py.part1 \
            orchestrator_private/src/tests/test_completion_verification.py.part2 \
            > orchestrator_private/src/tests/test_completion_verification.py
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile hardened modules
        working-directory: orchestrator_private/src
        run: |
          python -m py_compile \
            orchestrator/main.py \
            orchestrator/state_machine.py \
            orchestrator/lease_manager.py \
            orchestrator/process_lock.py \
            orchestrator/artifact_verifier.py
      - name: Run accepted chaos suites
        working-directory: orchestrator_private/src
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_lease_chaos.py tests/test_completion_verification.py
