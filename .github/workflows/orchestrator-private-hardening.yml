name: Orchestrator private hardening

on:
  pull_request:
    paths:
      - 'orchestrator_private/**'
      - '.github/workflows/orchestrator-private-hardening.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack accepted integration bundle
        run: |
          rm -rf /tmp/orchestrator_patch2
          mkdir -p /tmp/orchestrator_patch2
          unzip -q orchestrator_private/orchestrator_patch2_complete.zip -d /tmp/orchestrator_patch2
      - name: Verify bundle hash
        run: echo '6e104361feedefa98c5b75110f1204a7306575d232ae776b292306bb5ab12ede  orchestrator_private/orchestrator_patch2_complete.zip' | sha256sum -c -
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile hardened modules
        working-directory: /tmp/orchestrator_patch2/PATCH2_DELIVERY
        run: |
          python -m py_compile \
            orchestrator/main.py \
            orchestrator/state_machine.py \
            orchestrator/lease_manager.py \
            orchestrator/process_lock.py \
            orchestrator/artifact_verifier.py
      - name: Run accepted chaos suites
        working-directory: /tmp/orchestrator_patch2/PATCH2_DELIVERY
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_lease_chaos.py tests/test_completion_verification.py
