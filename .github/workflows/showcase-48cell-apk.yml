name: Showcase 48-cell Android APK

on:
  push:
    paths:
      - '.github/workflows/showcase-48cell-apk.yml'
      - 'export_presets.cfg'
      - 'scripts/**'
      - 'tests/**'
      - 'project.godot'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/showcase-48cell-apk.yml'
      - 'export_presets.cfg'
      - 'scripts/**'
      - 'tests/**'
      - 'project.godot'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run focused showcase tests
        run: python -m unittest tests/test_streaming_logic.py tests/test_showcase_demo_packaging.py -v

      - name: Download verified 48-cell world artifact
        uses: actions/download-artifact@v4
        with:
          name: dortmund-connected-world-48cells
          path: assets/world_cells
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Zweeback/dortmundgamemap
          run-id: 32152051688

      - name: Verify staged world contract
        run: |
          set -euxo pipefail
          test -s assets/world_cells/index.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('assets/world_cells/index.json')
          idx = json.loads(p.read_text())
          assert idx['crs'] == 'EPSG:25832'
          assert idx['world_origin'] == [392192.0, 5704704.0, 100.0]
          assert len(idx['cells']) == 48
          building_refs = 0
          missing = []
          for c in idx['cells']:
              for key in ('terrain_render', 'terrain_collision'):
                  q = p.parent / c[key]
                  if not q.is_file():
                      missing.append(str(q))
              for rel in c.get('buildings', []):
                  q = p.parent / rel
                  if not q.is_file():
                      missing.append(str(q))
                  building_refs += 1
          assert building_refs > 0, 'expected at least one streamed buildings asset'
          assert not missing, missing[:20]
          print(f"SHOWCASE_WORLD_OK cells={len(idx['cells'])} building_refs={building_refs}")
          PY
          du -sh assets/world_cells

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'

      - name: Install Godot 4.7.1 + export templates
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 -o /tmp/godot.zip 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1'
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          curl -L --fail --retry 4 -o /tmp/templates.tpz 'https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.7.1'
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          godot --version

      - name: Configure Android export
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          JAVA_HOME_REAL="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          ANDROID_SDK_REAL="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_REAL"
          export/android/android_sdk_path = "$ANDROID_SDK_REAL"
          EOF
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000

      - name: Godot import and spawn-stream smoke
        run: |
          set -euxo pipefail
          godot --headless --editor --path . --quit
          timeout 24s godot --headless --path . --quit-after 120 2>&1 | tee /tmp/showcase-smoke.log || true
          grep -q 'WorldStreamingManager: loaded 48 cells' /tmp/showcase-smoke.log
          grep -q 'CELL_LOADED' /tmp/showcase-smoke.log
          grep -q 'COLLISION_BATCH_READY' /tmp/showcase-smoke.log
          grep -q 'BUILDING_BOUNDS_CACHED count=' /tmp/showcase-smoke.log
          grep -q 'SPAWN_REGRESSION_BLOCKED_OK' /tmp/showcase-smoke.log
          grep -q 'SPAWN_SAFE_RESOLVED' /tmp/showcase-smoke.log
          grep -q 'SPAWN_READY_FOR_PLAY' /tmp/showcase-smoke.log
          grep -q 'HUD_DEBUG_METRICS' /tmp/showcase-smoke.log
          if grep -q 'SPAWN_REGRESSION_GUARD_FAILED' /tmp/showcase-smoke.log; then
            echo 'Historic in-building spawn regression guard failed' >&2
            exit 1
          fi
          python - <<'PY'
          import re
          text = open('/tmp/showcase-smoke.log', encoding='utf-8', errors='replace').read()
          m = re.search(r'BUILDING_BOUNDS_CACHED count=(\d+)', text)
          assert m and int(m.group(1)) > 0, 'no building bounds were collected'
          m = re.search(r'SPAWN_SAFE_RESOLVED position=\(([-0-9.]+), ([-0-9.]+), ([-0-9.]+)\)', text)
          assert m, 'missing resolved spawn coordinates'
          x, y, z = map(float, m.groups())
          assert (abs(x - 2652.0) > 0.5 or abs(z + 376.0) > 0.5), 'safe resolver reused the historic blocked X/Z'
          print(f'SPAWN_GATE_OK x={x:.3f} y={y:.3f} z={z:.3f}')
          PY

      - name: Export ARM64 showcase APK
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --path . --export-debug 'Android' "$GITHUB_WORKSPACE/build/DortmundGameMap-48Cell-Showcase.apk"
          test -s build/DortmundGameMap-48Cell-Showcase.apk
          unzip -l build/DortmundGameMap-48Cell-Showcase.apk | grep 'assets/world_cells/index.json'
          unzip -l build/DortmundGameMap-48Cell-Showcase.apk | grep 'assets/world_cells/e394752_n5704704/terrain_render.glbraw'
          unzip -l build/DortmundGameMap-48Cell-Showcase.apk | grep 'assets/world_cells/e394752_n5704704/terrain_collision.glbraw'
          APK_SIZE="$(stat -c%s build/DortmundGameMap-48Cell-Showcase.apk)"
          APK_SHA="$(sha256sum build/DortmundGameMap-48Cell-Showcase.apk | awk '{print $1}')"
          echo "APK_SIZE_BYTES=$APK_SIZE" | tee -a "$GITHUB_ENV"
          echo "APK_SHA256=$APK_SHA" | tee -a "$GITHUB_ENV"
          echo "PACKAGE_ID=com.bentropie.dortmundgamemap.showcase48" | tee -a "$GITHUB_ENV"
          ls -lh build/DortmundGameMap-48Cell-Showcase.apk
          sha256sum build/DortmundGameMap-48Cell-Showcase.apk

      - name: Write APK metadata
        run: |
          cat > build/DortmundGameMap-48Cell-Showcase-metadata.json <<EOF
          {
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "head_sha": "${GITHUB_SHA}",
            "package_id": "${PACKAGE_ID}",
            "apk_name": "DortmundGameMap-48Cell-Showcase.apk",
            "apk_size_bytes": ${APK_SIZE_BYTES},
            "apk_sha256": "${APK_SHA256}",
            "source_artifact_run_id": 32152051688,
            "source_artifact_id": 9330490936,
            "source_artifact_name": "dortmund-connected-world-48cells",
            "source_artifact_digest": "ddc798569936ac608fa18381a770ae91cd9ca658c39765007923975b51858408"
          }
          EOF
          cat build/DortmundGameMap-48Cell-Showcase-metadata.json

      - name: Upload showcase APK
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: DortmundGameMap-48Cell-Showcase-APK
          path: |
            build/DortmundGameMap-48Cell-Showcase.apk
            build/DortmundGameMap-48Cell-Showcase-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize showcase artifact
        run: |
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "artifact_id=${{ steps.upload_apk.outputs.artifact-id }}"
            echo "artifact_name=DortmundGameMap-48Cell-Showcase-APK"
            echo "apk_size_bytes=${APK_SIZE_BYTES}"
            echo "apk_sha256=${APK_SHA256}"
            echo "package_id=${PACKAGE_ID}"
            echo "head_sha=${GITHUB_SHA}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
