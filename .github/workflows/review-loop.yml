name: Review loop orchestrator

# Current review state machine (GitHub Models was retired on 2026-07-30):
#   CI_GREEN -> COPILOT_REVIEW_REQUESTED -> SUPERVISOR_REQUIRED
#
# Copilot code review is a COMMENT review, not an approval. This workflow never
# auto-merges and never pretends that a Copilot comment is a human approval.
#
# Trigger:
#   - workflow_dispatch with a PR number
#   - add the label "review-loop" to an open PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run the review loop against'
        required: true
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate-label:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'review-loop')
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Resolve PR number
        id: resolve
        env:
          DISPATCH_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          PR="${DISPATCH_PR:-$EVENT_PR}"
          if [ -z "$PR" ]; then
            echo "::error::Could not determine PR number"
            exit 1
          fi
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"

  ci-green-check:
    needs: gate-label
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.check.outputs.state }}
      bad_checks: ${{ steps.check.outputs.bad_checks }}
    steps:
      - name: Check external CI status on PR head
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate-label.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Do not count this review-loop workflow against itself. gh pr checks
          # exposes a normalized bucket: pass/fail/pending/skipping/cancel.
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json name,state,workflow,bucket > /tmp/checks.json
          BAD=$(python3 - <<'PY'
          import json
          checks=json.load(open('/tmp/checks.json'))
          bad=[]
          for c in checks:
              if c.get('workflow') == 'Review loop orchestrator':
                  continue
              if c.get('bucket') in {'fail','pending','cancel'}:
                  bad.append(f"{c.get('workflow','?')}::{c.get('name','?')}::{c.get('bucket','?')}")
          print(len(bad))
          open('/tmp/bad-checks.txt','w').write('\n'.join(bad))
          PY
          )
          echo "bad_checks=$BAD" >> "$GITHUB_OUTPUT"
          if [ "$BAD" != "0" ]; then
            echo "::warning::$BAD external check(s) are not green"
            cat /tmp/bad-checks.txt || true
            echo "state=CI_GREEN_PENDING" >> "$GITHUB_OUTPUT"
          else
            echo "state=CI_GREEN" >> "$GITHUB_OUTPUT"
          fi

  request-copilot-review:
    needs: [gate-label, ci-green-check]
    if: needs.ci-green-check.outputs.state == 'CI_GREEN'
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.request.outputs.outcome }}
    steps:
      - name: Request GitHub Copilot code review
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate-label.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]'
          echo "outcome=COPILOT_REVIEW_REQUESTED" >> "$GITHUB_OUTPUT"

  supervisor-gate:
    needs: [gate-label, ci-green-check, request-copilot-review]
    if: always() && needs.gate-label.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Compute current state
        id: state
        env:
          CI_STATE: ${{ needs.ci-green-check.outputs.state }}
          REVIEW_RESULT: ${{ needs.request-copilot-review.result }}
          REVIEW_OUTCOME: ${{ needs.request-copilot-review.outputs.outcome }}
        run: |
          if [ "$CI_STATE" = "CI_GREEN" ] && [ "$REVIEW_RESULT" = "success" ] && [ "$REVIEW_OUTCOME" = "COPILOT_REVIEW_REQUESTED" ]; then
            echo "final=SUPERVISOR_REQUIRED" >> "$GITHUB_OUTPUT"
          else
            echo "final=REWORK" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure state labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "review-requested" --color "1d76db" --description "Copilot review requested; supervisor decision pending" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh label create "rework" --color "e11d48" --description "CI or review orchestration requires rework" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

      - name: Apply state label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate-label.outputs.pr_number }}
          FINAL: ${{ steps.state.outputs.final }}
        run: |
          if [ "$FINAL" = "SUPERVISOR_REQUIRED" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "review-requested" --remove-label "rework" 2>/dev/null || \
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "review-requested"
          else
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "rework" --remove-label "review-requested" 2>/dev/null || \
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "rework"
          fi

      - name: Post supervisor handoff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate-label.outputs.pr_number }}
          FINAL: ${{ steps.state.outputs.final }}
          CI_STATE: ${{ needs.ci-green-check.outputs.state }}
          REVIEW_OUTCOME: ${{ needs.request-copilot-review.outputs.outcome }}
        run: |
          BODY="### Review-loop v2\n\n| Gate | State |\n|---|---|\n| External CI | \`$CI_STATE\` |\n| Copilot code review | \`${REVIEW_OUTCOME:-NOT_REQUESTED}\` |\n| **Current state** | **\`$FINAL\`** |\n\n\`CI_GREEN → COPILOT_REVIEW_REQUESTED → SUPERVISOR_REQUIRED\`\n\nCopilot code review is advisory and does not count as an approval. No auto-merge occurs.\n\n---\nRun: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
