name: Review loop orchestrator

# Current review state machine (GitHub Models was retired on 2026-07-30):
#   CI_GREEN_PENDING | CI_GREEN -> COPILOT_REVIEW_REQUESTED -> SUPERVISOR_REQUIRED
#   hard CI/review orchestration failure -> REWORK
#
# Copilot code review is a COMMENT review, not an approval. This workflow never
# auto-merges and never pretends that a Copilot comment is a human approval.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run the review loop against'
        required: true
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate-label:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'review-loop')
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Resolve PR number
        id: resolve
        env:
          DISPATCH_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          PR="${DISPATCH_PR:-$EVENT_PR}"
          if [ -z "$PR" ]; then
            echo "::error::Could not determine PR number"
            exit 1
          fi
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"

  ci-green-check:
    needs: gate-label
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.check.outputs.state }}
      bad_checks: ${{ steps.check.outputs.bad_checks }}
    steps:
      - name: Check external CI status on PR head
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate-label.outputs.pr_number }}
          CURRENT_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json name,state,workflow,bucket > /tmp/checks.json
          RESULT=$(python3 - <<'PY'
          import json, os
          checks=json.load(open('/tmp/checks.json'))
          current=os.environ.get('CURRENT_WORKFLOW','')
          hard=[]
          pending=[]
          for c in checks:
              if c.get('workflow') == current:
                  continue
              bucket=c.get('bucket')
              label=f"{c.get('workflow','?')}::{c.get('name','?')}::{bucket or '?'}"
              if bucket in {'fail','cancel'}:
                  hard.append(label)
              elif bucket == 'pending':
                  pending.append(label)
          open('/tmp/hard-checks.txt','w').write('\n'.join(hard))
          open('/tmp/pending-checks.txt','w').write('\n'.join(pending))
          if hard:
              print(f"REWORK:{len(hard)}")
          elif pending:
              print(f"CI_GREEN_PENDING:{len(pending)}")
          else:
              print('CI_GREEN:0')
          PY
          )
          STATE=${RESULT%%:*}
          COUNT=${RESULT##*:}
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "bad_checks=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$STATE" = "REWORK" ]; then
            echo "::error::$COUNT external check(s) failed/cancelled"
            cat /tmp/hard-checks.txt || true
          elif [ "$STATE" = "CI_GREEN_PENDING" ]; then
            echo "::notice::$COUNT external check(s) still pending"
            cat /tmp/pending-checks.txt || true
          fi

  request-copilot-review:
    needs: [gate-label, ci-green-check]
    if: needs.ci-green-check.outputs.state == 'CI_GREEN'
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.request.outputs.outcome }}
    steps:
      - name: Request GitHub Copilot code review idempotently
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate-label.outputs.pr_number }}
        run: |
          set -euo pipefail
          REQUESTED=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" \
            --jq '.users[].login' 2>/dev/null || true)
          if printf '%s\n' "$REQUESTED" | grep -Eq '^copilot-pull-request-reviewer(\[bot\])?$'; then
            echo "Copilot review is already requested; keeping the gate idempotent."
          else
            gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" \
              -f 'reviewers[]=copilot-pull-request-reviewer[bot]'
          fi
          echo "outcome=COPILOT_REVIEW_REQUESTED" >> "$GITHUB_OUTPUT"

  supervisor-gate:
    needs: [gate-label, ci-green-check, request-copilot-review]
    if: always() && needs.gate-label.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Compute current state
        id: state
        env:
          CI_STATE: ${{ needs.ci-green-check.outputs.state }}
          REVIEW_RESULT: ${{ needs.request-copilot-review.result }}
          REVIEW_OUTCOME: ${{ needs.request-copilot-review.outputs.outcome }}
        run: |
          if [ "$CI_STATE" = "CI_GREEN_PENDING" ]; then
            echo "final=CI_GREEN_PENDING" >> "$GITHUB_OUTPUT"
          elif [ "$CI_STATE" = "CI_GREEN" ] && [ "$REVIEW_RESULT" = "success" ] && [ "$REVIEW_OUTCOME" = "COPILOT_REVIEW_REQUESTED" ]; then
            echo "final=SUPERVISOR_REQUIRED" >> "$GITHUB_OUTPUT"
          else
            echo "final=REWORK" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure state labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "supervisor-required" --color "1d76db" --description "Copilot review requested; supervisor decision pending" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh label create "ci-pending" --color "fbca04" --description "External CI is still running" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh label create "rework" --color "e11d48" --description "CI or review orchestration requires rework" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

      - name: Apply state label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate-label.outputs.pr_number }}
          FINAL: ${{ steps.state.outputs.final }}
        run: |
          case "$FINAL" in
            SUPERVISOR_REQUIRED)
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "supervisor-required" --remove-label "rework" --remove-label "ci-pending" 2>/dev/null || \
                gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "supervisor-required"
              ;;
            CI_GREEN_PENDING)
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "ci-pending" --remove-label "rework" --remove-label "supervisor-required" 2>/dev/null || \
                gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "ci-pending"
              ;;
            *)
              gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "rework" --remove-label "supervisor-required" --remove-label "ci-pending" 2>/dev/null || \
                gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "rework"
              ;;
          esac

      - name: Post supervisor handoff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.gate-label.outputs.pr_number }}
          FINAL: ${{ steps.state.outputs.final }}
          CI_STATE: ${{ needs.ci-green-check.outputs.state }}
          REVIEW_OUTCOME: ${{ needs.request-copilot-review.outputs.outcome }}
        run: |
          BODY="### Review-loop v2\n\n| Gate | State |\n|---|---|\n| External CI | \`$CI_STATE\` |\n| Copilot code review | \`${REVIEW_OUTCOME:-NOT_REQUESTED}\` |\n| **Current state** | **\`$FINAL\`** |\n\n\`CI_GREEN_PENDING | CI_GREEN → COPILOT_REVIEW_REQUESTED → SUPERVISOR_REQUIRED\`\n\nCopilot code review is advisory and does not count as an approval. No auto-merge occurs.\n\n---\nRun: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
