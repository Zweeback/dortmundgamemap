name: Grok adversarial review

# Gate: GROK_REVIEWED
# Triggered manually or by review-loop orchestrator.
# Read-only: posts a PR comment with adversarial/runtime-risk assessment.
# No auto-merge, no code mutation.
#
# Model: xai/grok-3 via GitHub Models (models.inference.ai.azure.com)
# Requires: Models permission enabled for this repository and a valid GITHUB_TOKEN
# with models: read scope (available by default on GitHub-hosted runners when
# GitHub Models is enabled for the org/repo).
#
# Blocker: GitHub Models must be enabled for the repository (Settings > Copilot >
# GitHub Models). If the model endpoint returns 403/404 the workflow will fail
# with an explicit diagnostic message.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      state:
        description: 'Current pipeline state (must be GEMINI_REVIEWED)'
        required: false
        default: 'GEMINI_REVIEWED'
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      state:
        required: false
        type: string
        default: 'GEMINI_REVIEWED'
    outputs:
      outcome:
        description: 'GROK_REVIEWED or REWORK'
        value: ${{ jobs.grok-review.outputs.outcome }}

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  grok-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      outcome: ${{ steps.post-comment.outputs.outcome }}

    steps:
      - uses: actions/checkout@v4

      - name: Fetch PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > /tmp/pr.diff 2>&1 || {
            echo "::error::Could not fetch diff for PR $PR_NUMBER"
            exit 1
          }
          head -c 24000 /tmp/pr.diff > /tmp/pr_truncated.diff

      - name: Call GitHub Models – Grok 3
        id: grok
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIFF=$(cat /tmp/pr_truncated.diff)
          DIFF_JSON=$(printf '%s' "$DIFF" | python3 -c "
          import sys, json
          print(json.dumps(sys.stdin.read()))
          ")

          PAYLOAD=$(cat <<EOF
          {
            "model": "xai/grok-3",
            "messages": [
              {
                "role": "system",
                "content": "You are an adversarial security and runtime-risk reviewer for a Godot 4 geospatial game. Review ONLY the supplied diff. Focus on: (1) runtime crashes or panics, (2) memory/resource leaks in streaming code, (3) secret or credential exposure, (4) supply-chain risks in new dependencies, (5) Android build breakage. Do NOT suggest style changes. End your review with one of: RUNTIME_RISK_ACCEPTABLE or RUNTIME_RISK_FOUND."
              },
              {
                "role": "user",
                "content": $DIFF_JSON
              }
            ],
            "max_tokens": 1024
          }
          EOF
          )

          HTTP_STATUS=$(curl -s -o /tmp/grok_response.json -w "%{http_code}" \
            -X POST "https://models.inference.ai.azure.com/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: ******" \
            -d "$PAYLOAD")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::GitHub Models returned HTTP $HTTP_STATUS. Ensure GitHub Models is enabled for this repository (Settings > Copilot > GitHub Models). Response: $(cat /tmp/grok_response.json)"
            exit 1
          fi

          REVIEW=$(python3 -c "
          import json, sys
          d = json.load(open('/tmp/grok_response.json'))
          print(d['choices'][0]['message']['content'])
          ")
          echo "$REVIEW" > /tmp/grok_review.txt

          if echo "$REVIEW" | grep -q "RUNTIME_RISK_FOUND"; then
            echo "outcome=REWORK" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=GROK_REVIEWED" >> "$GITHUB_OUTPUT"
          fi
          echo "review_body<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/grok_review.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Post review comment
        id: post-comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          OUTCOME: ${{ steps.grok.outputs.outcome }}
        run: |
          BODY="### 🔴 Grok Adversarial Review

          **Model:** \`xai/grok-3\` via GitHub Models
          **Gate:** \`GROK_REVIEWED\`
          **Outcome:** \`$OUTCOME\`

          $(cat /tmp/grok_review.txt)

          ---
          *This comment was posted automatically by the review-loop workflow. No auto-merge will occur.*"

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
